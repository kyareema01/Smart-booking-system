<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>GoldTouch Booking</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a192f;
      color: #ccd6f6;
      display: flex;
      justify-content: center;
      padding: 50px;
    }

    .card {
      background: #112240;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 400px;
      border: 1px solid rgba(100, 255, 218, 0.1);

    }

    h2 {
      color: #64ffda;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      color: #8892b0;
      font-size: 0.9rem;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #233554;
      background: #0a192f;
      color: white;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    button {
      background-color: #64ffda;
      color: #0a192f;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 10px;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #52e0c4;
    }

    #resultBox {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
      background: #233554;
    }

    .success {
      border-left: 4px solid #64ffda;
    }

    .error {
      color: red;
    }

    .warning {
      border-left: 4px solid #ffd700;
    }

    .price-box {
      background: #233554;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Smart Scheduler Engine</h2>
    <p style="color: #8892b0; font-size: 0.9rem;">Simulating constraints for March 7th, 2026.</p>

    <!-- SERVICE -->
    <select id="service">
      <option value="">Select Service</option>
      <option value="house">🏠 House Cleaning</option>
      <option value="couch">🛋 Couch Cleaning</option>
      <option value="rug">🧼 Rug Cleaning</option>
    </select>

    <select id="dirt">
      <option value="">Select Dirt Level</option>
      <option value="light">Light Dirt</option>
      <option value="moderate">Moderate Dirt</option>
      <option value="heavy">Heavy Dirt</option>
    </select>
    <!-- PRICE DISPLAY  -->
    <div class="price-box" id="priceBox"></div>

    <label>Requested Start Time:</label>
    <input type="time" id="timeInput" value="10:00">

    <label>Duration (Minutes):</label>
    <input type="number" id="durationInput" value="45">

    <button onclick="checkAvailability()">Check Availability</button>


    <div id="resultBox"></div>
    <button onclick="book()">Book Now</button>
  </div>


  <script>
    // HTML Ele
    let services = document.getElementById('service');
    let dirt = document.getElementById('dirt');
    let priceBox = document.getElementById('priceBox');
    let duration = document.getElementById('durationInput');

    // Data Model
    const SERVICES = {
      house: {
        light: { price: 3000 },
        moderate: { price: 4500 },
        heavy: { price: 6000 }
      },
      couch: {
        light: { price: 3000 },
        moderate: { price: 4000 },
        heavy: { price: 5000 }
      },
      rug: {
        light: { price: 2000 },
        moderate: { price: 3000 },
        heavy: { price: 4000 }
      }
    };


    // -- Frontend Auth --

    // UPDATE PRICE

    let currentDuration;
    
    function updateDisplay() {
      const serviceKey = services.value
      const dirtKey = dirt.value
      currentDuration = parseInt(duration.value) || 0

      if (!serviceKey || !dirtKey) return

      // selectedService = SERVICE.house.light (example)
      let selectedService = SERVICES[serviceKey]?.[dirtKey]

      if (!selectedService) {
        document.getElementById('priceBox').innerHTML = "Selection not available for this dirt level";
        return;
      }

      // console.log("Service Key:", serviceKey);
      // console.log("Dirt Key:", dirtKey);
      // console.log("Full Service Object:", SERVICES[serviceKey]);
      priceBox.innerHTML =
        // selectedService.price = (Service.house.light.price)
        `Price: ₦${selectedService.price}<br>
          Dirt: ${dirtKey}<br>
        Duration: ${currentDuration}mins
        <br><br>
        Total: ₦${currentDuration * selectedService.price}
      `;
    }

    services.addEventListener('change', updateDisplay)
    dirt.addEventListener('change', updateDisplay)
    duration.addEventListener('input', updateDisplay)

    function showMessage(text, type) {
      const msg = document.getElementById('resultBox');
      msg.style.display = 'block'
      msg.className = "message " + type;
      msg.innerText = text;
    }

    function getStartTime() {
      const time = document.getElementById('timeInput').value;
      return new Date(`2026-03-07T${time}:00`).getTime();
    }

    // CHECK AVAILABILITY
    async function checkAvailability() {

      const start = getStartTime();

      const res = await fetch("http://localhost:5000/api/bookings/check", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          start,
          duration: currentDuration
        })
      });

      const data = await res.json();

      if (data.available) {
        showMessage("✅ Slot Available!", "success");
      } else {
        showMessage("❌ Not available, finding next slot...", "warning");

        const next = await fetch("http://localhost:5000/api/bookings/next-slot", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            start,
            duration: currentDuration
          })
        });

        const nextData = await next.json();

        showMessage(
          `Next available: ${new Date(nextData.nextAvailable).toLocaleTimeString()}`,
          "warning"
        );
      }
    }

    // BOOK
    async function book() {

      const start = getStartTime();

      const res = await fetch("http://localhost:5000/api/bookings/create", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          customerName: "Khalifa",
          start,
          duration: currentDuration
        })
      });

      const data = await res.json();

      if (data.success) {
        showMessage("✅ Booking Confirmed!", "success");
      } else {
        showMessage(data.message || "Booking failed", "error");
      }
    }
  </script>
</body>

</html>
