<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GoldTouch Booking</title>

  <style>
    /* RESET */
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      /* background: #f9f9f9;
       */
       background: #f1c63a;
    }

    /* CENTER */
    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CARD */
    .card {
      background: white;
      padding: 40px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* TITLE */
    h1 {
      margin: 0;
      margin-bottom: 5px;
    }

    .gold {
      color: #C9A227;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* INPUTS */
    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #C9A227;
      box-shadow: 0 0 5px rgba(201,162,39,0.3);
    }

    /* BUTTON */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #C9A227;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b8961f;
    }

    /* MESSAGE */
    .message {
      margin-top: 15px;
      font-size: 14px;
    }

    .success { color: green; }
    .error { color: red; }
    .warning { color: #C9A227; }

    /* PRICE BOX */
    .price-box {
      background: #faf7ea;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1><span class="gold">Gold</span>Touch</h1>
    <p class="subtitle">Book your cleaning service</p>

    <!-- SERVICE -->
    <select id="service">
      <option value="">Select Service</option>
      <option value="house">🏠 House Cleaning</option>
      <option value="couch">🛋 Couch Cleaning</option>
      <option value="rug">🧼 Rug Cleaning</option>
    </select>

    <!-- TIME -->
    <input type="time" id="time">

    <!-- PRICE DISPLAY -->
    <div class="price-box" id="priceBox">
      Select a service to see price
    </div>

    <!-- BUTTONS -->
    <button onclick="checkAvailability()">Check Availability</button>
    <button onclick="book()">Book Now</button>

    <!-- RESULT -->
    <p id="message" class="message"></p>

  </div>
</div>

<script>
  const SERVICES = {
    house: { duration: 45, price: 15000 },
    couch: { duration: 60, price: 5000 },
    rug: { duration: 45, price: 3000 }
  };

  let selectedService = null;


  // UPDATE PRICE
  document.getElementById('service').addEventListener('change', function() {
    selectedService = SERVICES[this.value];

    if (selectedService) {
      document.getElementById('priceBox').innerHTML =
        `Price: ₦${selectedService.price}<br>Duration: ${selectedService.duration} type`;
    }
  });

  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.className = "message " + type;
    msg.innerText = text;
  }

  function getStartTime() {
    const time = document.getElementById('time').value;
    return new Date(`2026-03-07T${time}:00`).getTime();
  }

  // CHECK AVAILABILITY
  async function checkAvailability() {

    if (!selectedService) {
      return showMessage("Select a service first", "error");
    }

    const start = getStartTime();

    const res = await fetch("http://localhost:5000/api/bookings/check", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        start,
        duration: selectedService.duration
      })
    });

    const data = await res.json();

    if (data.available) {
      showMessage("✅ Slot Available!", "success");
    } else {
      showMessage("❌ Not available, finding next slot...", "warning");

      const next = await fetch("http://localhost:5000/api/bookings/next-slot", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          start,
          duration: selectedService.duration
        })
      });

      const nextData = await next.json();

      showMessage(
        `Next available: ${new Date(nextData.nextAvailable).toLocaleTimeString()}`,
        "warning"
      );
    }
  }

  // BOOK
  async function book() {

    if (!selectedService) {
      return showMessage("Select a service first", "error");
    }

    const start = getStartTime();

    const res = await fetch("http://localhost:5000/api/bookings/create", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        customerName: "Khalifa",
        start,
        duration: selectedService.duration
      })
    });

    const data = await res.json();

    if (data.success) {
      showMessage("✅ Booking Confirmed!", "success");
    } else {
      showMessage(data.message || "Booking failed", "error");
    }
  }
</script>

</body>
</html>
